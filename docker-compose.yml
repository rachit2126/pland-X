version: '3.8'

services:
  mpp-parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpp-parser-service
    ports:
      - "8000:8000"
    environment:
      - MAX_UPLOAD_SIZE_MB=50
      - ALLOWED_EXTENSIONS=.mpp,.xml,.mpx,.mpt
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
